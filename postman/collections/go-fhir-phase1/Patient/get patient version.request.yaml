$kind: http-request
name: 'Get Patient Version'
method: GET
url: '{{baseUrl}}/api/v1/Patient/{{patientId}}/_history/1'
order: 8000
description: |-
  Retrieve a specific historical version of a Patient resource.

  Replace `1` in the path with the desired version ID (integer string).

  Returns 200 OK with the versioned Patient resource, or 404 if not found.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("resourceType is Patient", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Patient");
      });
