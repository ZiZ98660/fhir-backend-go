$kind: http-request
name: 'Get Patient History'
method: GET
url: '{{baseUrl}}/api/v1/Patient/{{patientId}}/_history'
order: 7000
description: |-
  Retrieve the full version history of a Patient resource as a FHIR Bundle of
  type `history`.

  Note: `_count`, `_since`, `_at`, and `_list` query parameters are not yet
  supported and will return 400 Bad Request.

  Returns 200 OK with a history Bundle, or 404 if the patient does not exist.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("Response is a FHIR history Bundle", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Bundle");
        pm.expect(body.type).to.equal("history");
      });
