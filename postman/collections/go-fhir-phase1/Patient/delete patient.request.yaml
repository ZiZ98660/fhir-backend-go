$kind: http-request
name: 'Delete Patient'
method: DELETE
url: '{{baseUrl}}/api/v1/Patient/{{patientId}}'
order: 6000
description: |-
  Soft-delete a Patient resource. Previous versions remain accessible via the
  history endpoint. Subsequent reads return 410 Gone.

  - `If-Match: W/"<version>"` is optional but recommended.
  - Returns 204 No Content on success.
  - Returns 404 if the patient does not exist.
  - Returns 412 if the supplied version does not match.
headers:
  - key: If-Match
    value: 'W/"1"'
    description: 'Optional optimistic-concurrency guard.'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", () => pm.expect(pm.response.code).to.equal(204));
