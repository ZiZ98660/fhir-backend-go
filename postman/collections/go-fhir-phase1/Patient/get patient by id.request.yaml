$kind: http-request
name: 'Get Patient by ID'
method: GET
url: '{{baseUrl}}/api/v1/Patient/{{patientId}}'
order: 3000
description: |-
  Read a single Patient resource by its server-assigned ID.

  Returns 200 OK with the Patient resource, `ETag`, and `Last-Modified` headers.
  Returns 404 if the patient does not exist, 410 Gone if it was deleted.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("resourceType is Patient", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Patient");
      });
      pm.test("ETag header present", () => pm.expect(pm.response.headers.get("ETag")).to.match(/^W\//));
