$kind: http-example
name: '503 Service Unavailable - Database Down'
request:
  url: '{{baseUrl}}/health'
  method: GET
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "down",
        "database": "disconnected"
      }
order: 2000
