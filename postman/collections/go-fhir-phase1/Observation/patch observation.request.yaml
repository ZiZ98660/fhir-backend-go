$kind: http-request
name: 'Patch Observation (JSON Patch)'
method: PATCH
url: '{{baseUrl}}/api/v1/Observation/{{observationId}}'
order: 5000
description: |-
  Apply a JSON Patch (RFC 6902) to an existing Observation resource.

  - Content-Type must be `application/json-patch+json`.
  - `If-Match: W/"<version>"` is optional but recommended.

  Returns 200 OK with the patched resource.
headers:
  - key: Content-Type
    value: application/json-patch+json
  - key: If-Match
    value: 'W/"1"'
    description: 'Optional optimistic-concurrency guard.'
    disabled: true
body:
  type: json
  content: |-
    [
      {"op": "replace", "path": "/status", "value": "corrected"}
    ]
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("resourceType is Observation", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Observation");
      });
