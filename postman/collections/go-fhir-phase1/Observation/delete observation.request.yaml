$kind: http-request
name: 'Delete Observation'
method: DELETE
url: '{{baseUrl}}/api/v1/Observation/{{observationId}}'
order: 6000
description: |-
  Soft-delete an Observation resource. Previous versions remain accessible via
  the history endpoint. Subsequent reads return 410 Gone.

  - `If-Match: W/"<version>"` is optional but recommended.
  - Returns 204 No Content on success.
headers:
  - key: If-Match
    value: 'W/"1"'
    description: 'Optional optimistic-concurrency guard.'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", () => pm.expect(pm.response.code).to.equal(204));
