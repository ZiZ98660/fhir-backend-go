$kind: collection
name: Observation
description: |-
  FHIR R4 Observation resource endpoints.

  Supported operations:
  - POST   /api/v1/Observation              – create
  - GET    /api/v1/Observation?patient={id} – search by patient
  - GET    /api/v1/Observation/{id}         – read by ID
  - PUT    /api/v1/Observation/{id}         – full replacement (If-Match optional)
  - PATCH  /api/v1/Observation/{id}         – JSON Patch (RFC 6902, If-Match optional)
  - DELETE /api/v1/Observation/{id}         – soft-delete (If-Match optional)
  - GET    /api/v1/Observation/{id}/_history          – version history bundle
  - GET    /api/v1/Observation/{id}/_history/{version} – specific version
order: 3000
