$kind: collection
name: Condition
description: |-
  FHIR R4 Condition resource endpoints.

  Supported operations:
  - POST   /api/v1/Condition              – create
  - GET    /api/v1/Condition?patient={id} – search by patient
  - GET    /api/v1/Condition/{id}         – read by ID
  - PUT    /api/v1/Condition/{id}         – full replacement (If-Match optional)
  - PATCH  /api/v1/Condition/{id}         – JSON Patch (RFC 6902, If-Match optional)
  - DELETE /api/v1/Condition/{id}         – soft-delete (If-Match optional)
  - GET    /api/v1/Condition/{id}/_history          – version history bundle
  - GET    /api/v1/Condition/{id}/_history/{version} – specific version
order: 4000
