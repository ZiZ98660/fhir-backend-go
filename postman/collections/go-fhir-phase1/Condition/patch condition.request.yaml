$kind: http-request
name: 'Patch Condition (JSON Patch)'
method: PATCH
url: '{{baseUrl}}/api/v1/Condition/{{conditionId}}'
order: 5000
description: |-
  Apply a JSON Patch (RFC 6902) to an existing Condition resource.

  - Content-Type must be `application/json-patch+json`.
  - `If-Match: W/"<version>"` is optional but recommended.

  Returns 200 OK with the patched resource.
headers:
  - key: Content-Type
    value: application/json-patch+json
  - key: If-Match
    value: 'W/"1"'
    description: 'Optional optimistic-concurrency guard.'
    disabled: true
body:
  type: json
  content: |-
    [
      {
        "op": "replace",
        "path": "/clinicalStatus",
        "value": {
          "coding": [
            {
              "system": "http://terminology.hl7.org/CodeSystem/condition-clinical",
              "code": "inactive"
            }
          ]
        }
      }
    ]
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("resourceType is Condition", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Condition");
      });
