$kind: http-request
name: 'Get Condition Version'
method: GET
url: '{{baseUrl}}/api/v1/Condition/{{conditionId}}/_history/1'
order: 8000
description: |-
  Retrieve a specific historical version of a Condition resource.

  Replace `1` in the path with the desired version ID.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.expect(pm.response.code).to.equal(200));
      pm.test("resourceType is Condition", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Condition");
      });
