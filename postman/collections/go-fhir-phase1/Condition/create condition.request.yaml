$kind: http-request
name: 'Create Condition'
method: POST
url: '{{baseUrl}}/api/v1/Condition'
order: 1000
description: |-
  Create a new FHIR R4 Condition resource.

  Required fields:
  - `resourceType`: must be `"Condition"`
  - `code`: must have `code.text` or at least one `code.coding[].code`
  - `subject.reference`: must be `"Patient/{id}"`

  Optional fields:
  - `clinicalStatus`: coding from http://terminology.hl7.org/CodeSystem/condition-clinical
    (active, recurrence, relapse, inactive, remission, resolved)
  - `verificationStatus`: coding from http://terminology.hl7.org/CodeSystem/condition-ver-status
    (unconfirmed, provisional, differential, confirmed, refuted, entered-in-error)
  - Only one onset[x] value is allowed (onsetDateTime, onsetAge, onsetPeriod, onsetRange, onsetString)
  - Only one abatement[x] value is allowed
  - Abated conditions require inactive/remission/resolved clinicalStatus

  Content-Type must be `application/fhir+json` or `application/json`.
  Returns 201 Created with `Location`, `ETag: W/"1"`, and the created Condition.
headers:
  - key: Content-Type
    value: application/fhir+json
body:
  type: json
  content: |-
    {
      "resourceType": "Condition",
      "clinicalStatus": {
        "coding": [
          {
            "system": "http://terminology.hl7.org/CodeSystem/condition-clinical",
            "code": "active"
          }
        ]
      },
      "verificationStatus": {
        "coding": [
          {
            "system": "http://terminology.hl7.org/CodeSystem/condition-ver-status",
            "code": "confirmed"
          }
        ]
      },
      "category": [
        {
          "coding": [
            {
              "system": "http://terminology.hl7.org/CodeSystem/condition-category",
              "code": "encounter-diagnosis"
            }
          ]
        }
      ],
      "code": {
        "coding": [
          {
            "system": "http://snomed.info/sct",
            "code": "44054006",
            "display": "Diabetes mellitus type 2"
          }
        ],
        "text": "Type 2 Diabetes Mellitus"
      },
      "subject": {"reference": "Patient/{{patientId}}"},
      "onsetDateTime": "2020-01-15",
      "recordedDate": "2020-01-20"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", () => pm.expect(pm.response.code).to.equal(201));
      pm.test("Location header present", () => pm.expect(pm.response.headers.get("Location")).to.match(/\/api\/v1\/Condition\//));
      pm.test("resourceType is Condition", () => {
        const body = pm.response.json();
        pm.expect(body.resourceType).to.equal("Condition");
        pm.collectionVariables.set("conditionId", body.id);
      });
